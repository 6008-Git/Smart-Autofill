<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-labelledby="title desc">
  <title id="title">Smart Autofill — Maintain once. Apply with confidence.</title>
  <desc id="desc">A local browser extension for job applications: click an input, choose saved information, confirm one field. No remote model calls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1423"/><stop offset="1" stop-color="#102c34"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020617" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1280" height="580" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="580" rx="24" fill="url(#grid)"/>
  <circle cx="1190" cy="54" r="204" fill="#14b8a6" opacity=".05"/>
  <g font-family="Inter,Segoe UI,Arial,Microsoft YaHei,sans-serif">
    <rect x="64" y="64" width="46" height="46" rx="13" fill="#14b8a6"/>
    <path d="M94 76H81a7 7 0 000 14h9a7 7 0 010 14H77" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <text x="126" y="94" fill="#cbd5e1" font-size="19" font-weight="600" letter-spacing="2">SMART AUTOFILL</text>
    <rect x="64" y="142" width="250" height="29" rx="14" fill="#1e3b40" stroke="#2d5558"/>
    <circle cx="82" cy="157" r="4" fill="#5eead4"/>
    <text x="96" y="163" fill="#a5f3e5" font-size="13" letter-spacing="1">LOCAL BROWSER EXTENSION</text>
    <text x="60" y="236" fill="#f8fafc" font-size="57" font-weight="750" letter-spacing="-2">Maintain once.</text>
    <text x="60" y="307" fill="url(#accent)" font-size="54" font-weight="750" letter-spacing="-2">Apply with confidence.</text>
    <text x="64" y="354" fill="#d5e4e8" font-size="25" font-weight="500">一次维护，多站复用。</text>
    <text x="64" y="387" fill="#a7bac7" font-size="17">Click an input. Choose your data. Confirm the field.</text>
    <g transform="translate(64 438)" font-size="14" fill="#dce7ee">
      <rect width="148" height="40" rx="9" fill="#17363c" stroke="#2d5558"/>
      <text x="18" y="25">Chrome / Edge</text>
      <rect x="160" width="126" height="40" rx="9" fill="#17363c" stroke="#2d5558"/>
      <text x="178" y="25">No model API</text>
      <rect x="298" width="96" height="40" rx="9" fill="#17363c" stroke="#2d5558"/>
      <text x="320" y="25">Alt + Z</text>
    </g>
    <text x="64" y="527" fill="#718e9d" font-size="12" letter-spacing="1.5">YOUR PROFILE. YOUR CHOICE. ONE FIELD AT A TIME.</text>
    <g transform="translate(782 94)" filter="url(#shadow)">
      <rect width="430" height="398" rx="18" fill="#f8fafc"/>
      <path d="M0 18A18 18 0 0118 0h394a18 18 0 0118 18v30H0Z" fill="#e5eef0"/>
      <circle cx="22" cy="23" r="5" fill="#a7b8c1"/><circle cx="39" cy="23" r="5" fill="#a7b8c1"/><circle cx="56" cy="23" r="5" fill="#a7b8c1"/>
      <text x="82" y="28" font-size="12" fill="#52616b">application / profile</text>
      <text x="26" y="84" font-size="13" fill="#52616b">Your current field</text>
      <rect x="24" y="98" width="382" height="43" rx="7" fill="#fff" stroke="#2563eb" stroke-width="2"/>
      <text x="38" y="125" font-size="15" fill="#94a3b8">Choose saved information…</text>
      <rect x="24" y="154" width="382" height="218" rx="10" fill="#fff" stroke="#d5dfe7"/>
      <text x="41" y="181" font-size="14" font-weight="650" fill="#172b36">Smart Autofill</text>
      <rect x="328" y="165" width="60" height="23" rx="6" fill="#ecfdf5"/>
      <text x="341" y="181" fill="#0f766e" font-size="11">LOCAL</text>
      <path d="M40 198H389" stroke="#e2e8f0"/>
      <text x="42" y="225" font-size="12" fill="#64748b">PROFILE</text>
      <text x="206" y="225" font-size="12" fill="#64748b">CHOOSE A RECORD</text>
      <path d="M185 210V314" stroke="#e2e8f0"/>
      <rect x="34" y="238" width="140" height="32" rx="5" fill="#eff6ff"/>
      <text x="45" y="260" font-size="14" fill="#2563eb">Education</text>
      <text x="45" y="293" font-size="14" fill="#475569">Work &amp; projects</text>
      <rect x="196" y="238" width="194" height="57" rx="5" fill="#ecfdf5"/>
      <text x="207" y="260" font-size="14" font-weight="600" fill="#0f766e">Example University</text>
      <text x="207" y="280" font-size="12" fill="#52616b">Computer Science · 2024–2027</text>
      <rect x="40" y="323" width="350" height="33" rx="6" fill="#0f766e"/>
      <path d="M149 339l4 4 8-9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="173" y="345" font-size="13" font-weight="600" fill="white">Confirm this field</text>
    </g>
    <text x="790" y="525" fill="#88a5b3" font-size="12">Illustration with fictional data · Manual confirmation</text>
  </g>
</svg>
